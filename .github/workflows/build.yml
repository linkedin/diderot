name: build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Install
        run: go get -v .
      - name: Build
        run: make build
      - name: Test
        run: make test TESTVERBOSE=-v
